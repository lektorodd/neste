<!DOCTYPE html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neste">
<meta name="theme-color" content="#0e1116">
<title>Neste</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="ikon/neste.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="ikon/neste-180.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
/*
VOICE: kjapp og tørr. Svarar på éin ting: når må eg gå for å vere tidlegast framme.
IDEA: eit avgangsskilt i lomma, rekna dør til dør.
PICTURE: den store "Gå om"-tala i ein lime boks; resten er rader.
COLOUR and TYPE: kveldsmørk grunn, lime signal, kald blå/grøn/sjøblå per transportmiddel. Archivo breitt og tungt for tal.
LAYOUT: éi kolonne, reiser som brikker øvst, oppsett som eige ark.
*/
:root{color-scheme:dark light;
 --bg:light-dark(#eef0f3,#0e1116);--card:light-dark(#fff,#171b22);--line:light-dark(#d8dce2,#262c36);
 --ink:light-dark(#0e1116,#f1f3f6);--mute:light-dark(#5a6472,#8b95a4);--field:light-dark(#f4f6f8,#0e1116);
 --sig:#d7ff3b;--bus:#3a6df0;--tram:#19b36b;--water:#0aa5c2;--rail:#8a5cf6;--warn:#f5b400;--bad:#ff4d6a}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Archivo,system-ui,sans-serif;overflow-x:clip;
 padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
h1{font-size:34px;font-weight:900;font-stretch:125%;letter-spacing:-.02em;line-height:1}
.hbtn{display:flex;gap:6px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;height:40px;padding:0 14px;font-weight:600;font-size:14px;color:var(--ink)}
#status{border:0;color:var(--mute);font-size:13px;padding:0 6px}
#status b{color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.chips button{flex:none;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
main{display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.card h2{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--mute);font-size:13px}
.hero{background:var(--sig);color:#0e1116;border-radius:24px;padding:18px 18px 16px}
.hero .k{font-size:14px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .k small{font-weight:500;opacity:.75;font-size:13px}
.flip{flex:none;border:0;border-radius:999px;height:38px;padding:0 14px;font-weight:800;font-size:14px;background:#0e1116;color:var(--sig)}
.hero.none .flip{background:var(--ink);color:var(--bg)}
.chk{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--bus)}
.res.inl{position:static;margin-top:8px;box-shadow:none}
.res.near button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.res.near .mk{font-size:20px;width:28px;text-align:center;color:var(--mute)}.near [aria-pressed=true] .mk{color:var(--tram)}
.where{font-size:14px;color:var(--mute);margin:2px 0 4px}.where b{color:var(--ink);font-weight:600}
.dlg .card{max-height:80vh;overflow:auto}
.hero .big{font-size:clamp(48px,15vw,84px);font-weight:900;font-stretch:125%;line-height:.92;letter-spacing:-.03em;margin:6px 0 8px;font-variant-numeric:tabular-nums}
.hero .big i{font-style:normal;font-size:.32em;letter-spacing:0;margin-left:6px}
.hero .s{font-size:16px;font-weight:600}.hero .s b{font-weight:900}
.hero.none{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:9px 0;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit}
.row:first-of-type{border-top:0}
.row.best{box-shadow:inset 4px 0 0 var(--sig);padding-left:10px;margin-left:-10px;width:calc(100% + 10px);border-radius:4px}
.row.miss{opacity:.45}
.pill{min-width:44px;height:30px;padding:0 8px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-stretch:112%;color:#fff;background:var(--c)}
.dest{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mute)}.sub .rt,.sub .occ{margin-right:6px;vertical-align:middle}
.when{text-align:right;white-space:nowrap}
.min{font-size:26px;font-weight:900;font-stretch:118%;line-height:1;font-variant-numeric:tabular-nums}
.min i{font-style:normal;font-size:14px;font-weight:600;margin-left:2px;color:var(--mute)}
.clock{font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.late{color:var(--warn);font-weight:700}
.cancel .dest{text-decoration:line-through;color:var(--bad)}
.rt{width:8px;height:8px;border-radius:50%;background:var(--tram);display:inline-block;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
.occ{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.occ span{width:4px;border-radius:1px;background:var(--line)}
.occ span:nth-child(1){height:5px}.occ span:nth-child(2){height:8px}.occ span:nth-child(3){height:12px}
.occ.o1 span:nth-child(1),.occ.o2 span:nth-child(-n+2){background:var(--tram)}.occ.o3 span{background:var(--bad)}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.cta{height:48px;border-radius:14px;border:0;background:var(--ink);color:var(--bg);font-weight:800;padding:0 18px;font-size:16px}
.sec{background:none;border:1px solid var(--line);border-radius:12px;height:44px;padding:0 14px;font-weight:600}
.x{background:none;border:0;width:44px;height:44px;color:var(--mute);font-size:22px;line-height:1}
input,select{font:500 16px Archivo,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;height:44px;padding:0 12px;width:100%}
input.n{width:64px;text-align:center;padding:0 6px}
input.name{font-weight:800;font-size:18px;background:none;border-color:transparent;padding-left:0}
input.name:focus{border-color:var(--line);padding-left:12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--bus);outline-offset:2px}
.stop{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c,var(--mute))}
.stop small{color:var(--mute);font-size:13px}
.srch{position:relative;margin-top:8px}
.res{position:absolute;left:0;right:0;top:48px;z-index:20;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.res button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px}
.res button:first-child{border-top:0}
.res small{color:var(--mute);display:block;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:8px;align-items:center}
.trip+.trip{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.trip .l{grid-column:1/4}
.trip .arrow{color:var(--mute);font-weight:800}
.note{font-size:13px;color:var(--mute);margin-top:6px}
#map{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;grid-template-rows:auto minmax(0,1fr) auto}
#map.on{display:grid}
#map .top{padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;gap:8px;align-items:center}
#map .top select{flex:1}
#mapc{background:#ccc}
#map .bot{padding:10px 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;flex-wrap:wrap}
#map .bot .note{width:100%;margin:0}
#map[data-mode=follow] .add,#map:not([data-mode=follow]) .fol{display:none}
#followHead{flex:1;display:flex;gap:8px;align-items:center;font-weight:700;white-space:nowrap;overflow:hidden}
#followHead b{overflow:hidden;text-overflow:ellipsis}
.bus-ic .pill{border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.leaflet-popup-content button{margin-top:6px;height:36px;border-radius:10px;border:0;background:#0e1116;color:#fff;padding:0 12px;font-weight:700}
.dlg{position:fixed;inset:auto 12px calc(env(safe-area-inset-bottom) + 12px);z-index:200;max-width:520px;margin:0 auto}
.wi{display:inline-grid;place-items:center;flex:none;width:16px;height:16px;border-radius:50%;background:var(--warn);color:#0e1116;font-size:11px;font-weight:900;margin-right:6px;vertical-align:-2px}
.sub.av{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avb,.sit{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;font-size:14px}
.avb{margin-top:12px;background:rgba(14,17,22,.1);color:#0e1116;border-radius:12px;padding:9px 10px;font-weight:700}
.sit{background:none;border-top:1px solid var(--line);padding:10px 0;color:var(--ink)}.sit:first-of-type{border-top:0}
.avb>span:nth-child(2),.sit>span:nth-child(2){flex:1}.go{color:inherit;opacity:.6;font-weight:800}
.sit .ln{display:inline-block;min-width:28px;padding:0 5px;margin-right:6px;border-radius:6px;border:1px solid var(--line);text-align:center;font-size:13px}
.avb .wi,.sit .wi{margin:0}.sitx{margin:8px 0;white-space:pre-line}.dlg a{color:var(--bus)}
footer{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
@media(prefers-reduced-motion:reduce){.rt{animation:none}}
</style>
</head>
<body>
<div class="wrap">
 <header><h1>Neste</h1><div class="hbtn"><button id="status" class="ghost" type="button" aria-label="Oppdater no">…</button><button id="setup" class="ghost" type="button">Oppsett</button></div></header>
 <nav class="chips" id="chips" aria-label="Reiser"></nav>
 <main id="app"></main>
 <footer>Sanntid frå Entur (NLOD). Grøn prikk = sanntid. Oppsettet ditt blir berre lagra i denne nettlesaren.</footer>
</div>
<div id="map" aria-modal="true" role="dialog" aria-label="Kart">
 <div class="top"><span class="add">Legg til i</span><select class="add" id="mapPlace"></select><div class="fol" id="followHead"></div><button class="sec" type="button" data-act="mapClose">Ferdig</button></div>
 <div id="mapc"></div>
 <div class="bot"><button class="cta add" type="button" data-act="mapStops">Vis stopp her</button><button class="sec" type="button" data-act="mapLocate">Min posisjon</button><button class="sec add" type="button" data-act="mapHome">Staden er her</button>
  <p class="note" id="mapNote">Flytt kartet, trykk «Vis stopp her», og trykk på eit stopp for å leggje det til.</p></div>
</div>
<div id="dlg" class="dlg"></div>
<script>
{
const CLIENT='lektorodd-neste',JP='https://api.entur.io/journey-planner/v3/graphql',GEO='https://api.entur.io/geocoder/v1/autocomplete';
const VEH='https://api.entur.io/realtime/v2/vehicles/graphql'; // posisjonar; berre spurt når kartet følgjer ein tur
const LEAFLET='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/';
const MODEC={bus:'var(--bus)',coach:'var(--bus)',tram:'var(--tram)',metro:'var(--tram)',water:'var(--water)',rail:'var(--rail)'};
const MODE_HEX={bus:'#3a6df0',coach:'#3a6df0',tram:'#19b36b',metro:'#19b36b',water:'#0aa5c2',rail:'#8a5cf6'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm=d=>d.toLocaleTimeString('nb-NO',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Oslo'});
const uid=()=>Math.random().toString(36).slice(2,9);
const mins=d=>Math.floor((d-Date.now())/60000);
const ls={get(k,d){try{const v=localStorage.getItem('neste.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('neste.'+k,JSON.stringify(v))}catch(e){}}};

// ---------- tilstand (berre lokalt) ----------
let cfg=ls.get('cfg',null)||{places:[{id:uid(),name:'Heim',stops:[]}],trips:[]};
// Kvar stadene er: {placeId:{lat,lon,label}}. Berre lagra her, aldri i cfg og difor aldri i delingslenka.
let pts=ls.get('pts',{});
{const h=ls.get('home',null);if(h){const p=cfg.places.find(p=>/heim/i.test(p.name))||cfg.places[0];if(p&&!pts[p.id])pts[p.id]={lat:h.lat,lon:h.lon,label:'heimepunktet'};ls.set('pts',pts);try{localStorage.removeItem('neste.home')}catch(e){}}}
const savePts=()=>ls.set('pts',pts);
let cur=ls.get('cur',null),view='trip';
let data=null,err=null,at=null,busy=false,shown=[],autoBy='';
const save=()=>{ls.set('cfg',cfg)};
const place=id=>cfg.places.find(p=>p.id===id);
const tripName=t=>t.ferry?`${t.ferry.a.name} ⇄ ${t.ferry.b.name}`:`${place(t.from)?.name||'?'} → ${place(t.to)?.name||'?'}`;
// Ei reise er anten frå stad til stad, eller eit ferjesamband {ferry:{a,b},dir:'ab'|'ba'} som blir vist frå den kaien du er ved.
function ends(t){
 if(!t.ferry)return[place(t.from),place(t.to)];
 const P=e=>({name:e.name,stops:[{id:e.id,name:e.full||e.name,walk:0}]}),{a,b}=t.ferry;
 return t.dir==='ba'?[P(b),P(a)]:[P(a),P(b)];
}
const short=n=>String(n).replace(/\s+(ferjekai|ferjeleie|ferjeterminal|ferjestø|kai)$/i,'')||n;

// ---------- Entur ----------
async function post(q,url=JP){
 const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','ET-Client-Name':CLIENT},body:JSON.stringify({query:q})});
 if(!r.ok)throw new Error('Entur svarte '+r.status);return r.json();
}
// Sjekka mot Journey Planner v3 25.11.2026. `next` er stoppa etter denne avgangen (rett dato, også over midnatt).
// Stopp i svaret er barne-stopp (t.d. ein kai); `parent.id` er den ID-en geocoderen og nearest gir.
const WATER='filters:[{select:[{transportModes:[{transportMode:water}]}]}]'; // berre ferjer og båtar
const CALL='realtime cancellation forBoarding quay{latitude longitude} aimedDepartureTime expectedDepartureTime occupancyStatus destinationDisplay{frontText} serviceJourney{id line{publicCode transportMode}} serviceJourneyEstimatedCalls{next{forAlighting quay{stopPlace{id parent{id}}} aimedArrivalTime expectedArrivalTime}} situations{situationNumber summary{value language}}';
// Avvik (SIRI SX): avgangane har berre samandraget med (Bergen busstasjon +2 % gzip, Oslo S +13 %). Heile teksten blir henta ved trykk.
// Entur gir berre avvik som gjeld på avgangstida, så validityPeriods trengst ikkje her.
const LANG=['nn','no','nob','nb',null,'','en'];
const pickLang=a=>{const v=(a||[]).filter(x=>x?.value?.trim());const r=LANG.map(l=>v.find(x=>(x.language??null)===l)).find(Boolean)||v[0];return r?r.value.trim():''};
const sits=new Map(); // situationNumber -> {sum, full}
async function gql(q){
 const r=await post(q);
 if(!r.data)throw new Error(r.errors?.[0]?.message||'Tomt svar');
 return r.data;
}
const ids=sp=>[sp?.id,sp?.parent?.id].filter(Boolean);
// Fleire kategoriar eller transportmiddel: tog og båt først, buss før trikk (terminalar med bybane).
const MODES=[['rail',/rail/i],['water',/harbour|ferry|water/i],['metro',/metro/i],['bus',/bus|coach/i],['tram',/tram/i]];
const pickMode=v=>{const c=[].concat(v||[]).join(' ');return(MODES.find(([,re])=>re.test(c))||['bus'])[0]};

// Linjene som går frå eit stopp, {id,code} per stopp-ID. Berre i minnet. Ein `publicCode` som «40» finst i heile landet,
// så filteret må byggje på line-ID-ane ved akkurat dette stoppet (quays dekkjer òg barne-stoppa til eit foreldre-stopp).
const stopLines=new Map();
async function linesAt(stops){
 const miss=stops.filter(s=>!stopLines.has(s.id));
 if(miss.length){
  const d=await gql('{'+miss.map((s,i)=>`l${i}:stopPlace(id:${JSON.stringify(s.id)}){quays{lines{id publicCode}}}`).join(' ')+'}');
  miss.forEach((s,i)=>{const m=new Map();for(const q of d['l'+i]?.quays||[])for(const l of q.lines||[])m.set(l.id,String(l.publicCode||'').toUpperCase());
   stopLines.set(s.id,[...m].map(([id,code])=>({id,code})))});
 }
 return stops.map(s=>stopLines.get(s.id)||[]);
}
const tripLines=t=>(t.lines||'').split(/[\s,]+/).filter(Boolean).map(s=>s.toUpperCase());
async function load(){
 const t=cfg.trips.find(x=>x.id===cur);
 if(!t||busy||view!=='trip')return;
 const [A,B]=ends(t),key=t.id+t.dir;
 if(!A?.stops.length||!B?.stops.length){data=[];err=null;render();return}
 busy=true;$('#status').textContent='Hentar …';
 try{
  // Med linjer: filtrer på serveren, så 60 avgangar er 60 avgangar med desse linjene (ikkje ein halvtime på ein terminal).
  // Stopp utan nokon av linjene blir ikkje spurde. Feilar oppslaget, hentar vi alt og filtrerer lokalt som før.
  const want=t.ferry?[]:tripLines(t);let sel=A.stops.map(()=>null);
  if(want.length)try{sel=(await linesAt(A.stops)).map(ls=>ls.filter(l=>want.includes(l.code)).map(l=>l.id))}catch(e){}
  const f=(i)=>t.ferry?','+WATER:sel[i]?`,filters:[{select:[{lines:${JSON.stringify(sel[i])}}]}]`:'';
  const qs=A.stops.map((s,i)=>sel[i]&&!sel[i].length?'':`g${i}:stopPlace(id:${JSON.stringify(s.id)}){estimatedCalls(numberOfDepartures:60,timeRange:86400${f(i)}){${CALL}}}`).filter(Boolean);
  const d=qs.length?await gql('{'+qs.join(' ')+'}'):{};
  if(t.id===cur&&t.id+t.dir===key){data=build(t,A,B,d);data.noLines=!qs.length;err=null;at=new Date()}
 }catch(e){err=e.message||String(e)}
 busy=false;
 // Bytte reise eller kai medan vi henta: hent på nytt for det som er valt no.
 const n=cfg.trips.find(x=>x.id===cur);if(n&&n.id+n.dir!==key){load();return}
 render();
}
function build(t,A,B,d){
 const lines=t.ferry?[]:tripLines(t); // òg lokalt, som tryggleik
 const out=new Map();
 A.stops.forEach((s,i)=>{
  for(const c of d['g'+i]?.estimatedCalls||[]){
   if(c.forBoarding===false)continue;
   const sj=c.serviceJourney,line=sj.line?.publicCode||'';
   if(lines.length&&!lines.includes(line.toUpperCase()))continue;
   if(t.ferry&&sj.line?.transportMode!=='water')continue;
   let best=null;
   for(const x of c.serviceJourneyEstimatedCalls?.next||[]){
    if(x.forAlighting===false)continue; // t.d. ekspressbussar som berre tek på passasjerar ut av byen
    const tgt=B.stops.find(b=>ids(x.quay?.stopPlace).includes(b.id));
    if(!tgt)continue;
    const arr=new Date(x.expectedArrivalTime||x.aimedArrivalTime);
    const door=new Date(+arr+(+tgt.walk||0)*60000);
    if(!best||door<best.door)best={arr,door,to:tgt};
   }
   if(!best)continue;
   const dep=new Date(c.expectedDepartureTime),aim=new Date(c.aimedDepartureTime);
   const r={line:line||'–',mode:sj.line?.transportMode||'bus',dest:c.destinationDisplay?.frontText||'',dep,delay:Math.round((dep-aim)/60000),
    rt:c.realtime,cancel:c.cancellation,occ:c.occupancyStatus,from:s,walk:+s.walk||0,sj:sj.id,quay:c.quay,...best,
    sit:(c.situations||[]).map(x=>{const n=x.situationNumber,sum=pickLang(x.summary);if(n&&sum&&!sits.has(n))sits.set(n,{sum});return sum&&n}).filter(Boolean)};
   // Same tur frå to av stoppa dine: behald det med mest slakk.
   const k=sj.id+'|'+aim.toISOString().slice(0,10),prev=out.get(k);
   if(!prev||(+r.dep-r.walk*60000)>(+prev.dep-prev.walk*60000))out.set(k,r);
  }
 });
 return[...out.values()];
}

function occ(o){
 if(!o||o==='noData')return'';
 const l=/empty|many/i.test(o)?1:/few/i.test(o)?2:3,t=['','God plass','Litt fullt','Fullt'][l];
 return`<span class="occ o${l}" title="${t}" aria-label="${t}"><span></span><span></span><span></span></span>`;

 if(!data)return'';
 data.forEach(r=>{r.leave=mins(r.dep)-r.walk});
 const ok=data.filter(r=>!r.cancel&&r.leave>=0).sort((a,b)=>a.door-b.door||a.dep-b.dep);

 let h='';
 if(best){
  const go=best.walk?(best.leave===0?'Gå no':'Gå om '+best.leave+'<i>min</i>'):(best.leave===0?'Går no':'Går om '+best.leave+'<i>min</i>');
  h+=`<section class="hero" aria-live="polite"><div class="k"><span>${kk}</span>${flip}</div><div class="big">${go}</div>

 }else h+=`<section class="hero none"><div class="k"><span>${t.ferry?kk+' · ':''}Ingen avgangar du rekk det neste døgeret.</span>${flip}</div></section>`;
 h+=`<section class="card"><h2>Sortert etter når du er framme <small>${esc(tripName(t))}</small></h2>${list.length?list.map((r,i)=>{
  const c=MODEC[r.mode]||'var(--bus)',miss=r.leave<0&&!r.cancel;

   <span class="pill">${esc(r.line)}</span>
   <div><div class="dest">${esc(r.cancel?'Innstilt – '+r.dest:r.dest)}</div>
    <div class="sub">${r.rt?'<span class="rt"></span>':''}${esc(r.from.name)} → ${esc(r.to.name)} · framme ${esc(hm(r.door))}${miss?' · rekk han ikkje':''}${occ(r.occ)}</div>${r.sit.length?`<div class="sub av"><span class="wi" aria-hidden="true">!</span>${esc(sits.get(r.sit[0]).sum)}</div>`:''}</div>
   <div class="when"><div class="min">${minHTML(mins(r.dep),r.dep)}</div><div class="clock">${esc(hm(r.dep))} ${r.delay>=2?`<span class="late">+${r.delay}</span>`:''}</div></div></button>`;
 }).join('')+'<p class="note">Trykk på ein avgang for å sjå kvar han er no.</p>':`<div class="empty">${data.noLines?`Fann ikkje linje ${esc(tripLines(t).join(', '))} ved stoppa i ${esc(A.name)}.`:'Fann ingen avgangar mellom desse stadane.'}</div>`}</section>`;
 // Alle avvik på avgangane i lista, med linjene dei gjeld. Trykk for heile teksten. Vy lagar eitt avvik per avgang

 return h;
}

function dist(la1,lo1,la2,lo2){ // meter, luftline
 const R=6371e3,toR=Math.PI/180,dl=(la2-la1)*toR,dn=(lo2-lo1)*toR;
 const a=Math.sin(dl/2)**2+Math.cos(la1*toR)*Math.cos(la2*toR)*Math.sin(dn/2)**2;
 return 2*R*Math.asin(Math.sqrt(a));
}
const lineWalk=(m)=>Math.max(1,Math.round(m*1.3/80)); // luftline × omveg, 80 m/min
// Gangtid frå punktet til stoppa, rekna av Entur (til fots langs vegar). Minutt per stopp-ID; manglar om ruta feila.
async function walkTimes(pt,ids){
 if(!ids.length)return{};
 const from=`{coordinates:{latitude:${(+pt.lat).toFixed(5)},longitude:${(+pt.lon).toFixed(5)}}}`;
 const d=await gql('{'+ids.map((id,i)=>`w${i}:trip(from:${from},to:{place:${JSON.stringify(id)}},modes:{directMode:foot,transportModes:[]},numTripPatterns:1){tripPatterns{duration}}`).join(' ')+'}');
 const out={};ids.forEach((id,i)=>{const s=d['w'+i]?.tripPatterns?.[0]?.duration;if(s!=null)out[id]=Math.max(1,Math.ceil(s/60))});
 return out;
}

let hiddenAt=0;
function autoSide(){
 const t=cfg.trips.find(x=>x.id===cur);
 if(!t?.ferry||!ls.get('autoside',false)||!navigator.geolocation)return;
 const {a,b}=t.ferry;if(a.lat==null||b.lat==null)return;
 navigator.geolocation.getCurrentPosition(p=>{
  if(cur!==t.id)return;
  const {latitude:la,longitude:lo}=p.coords,dir=dist(la,lo,a.lat,a.lon)<=dist(la,lo,b.lat,b.lon)?'ab':'ba';
  autoBy=t.id+dir;
  if(dir!==t.dir){t.dir=dir;save();data=null;err=null;render();load()}else if(view==='trip')render();
 },()=>{},{maximumAge:120000,timeout:10000});

function addStop(pid,s){
 const p=place(pid);if(!p||p.stops.some(x=>x.id===s.id))return;
 const pt=pts[pid],known=s.walk!=null&&s.walk!=='',ll=s.lat!=null&&s.lat!=='';
 const st={id:s.id,name:s.name,label:s.label||'',mode:s.mode||'bus',walk:known?+s.walk:pt&&ll?lineWalk(dist(pt.lat,pt.lon,+s.lat,+s.lon)):5};
 p.stops.push(st);save();
 // Har staden eit punkt, hent ekte gangtid og oppdater feltet utan å teikne oppsettet på nytt.
 if(pt&&!known)walkTimes(pt,[s.id]).then(m=>{
  if(m[s.id]==null||!p.stops.includes(st))return;st.walk=m[s.id];save();
  const el=document.querySelectorAll(`[data-place="${CSS.escape(pid)}"] [data-act=walk]`)[p.stops.indexOf(st)];if(el)el.value=st.walk;
 }).catch(()=>{});
}

   <div class="res inl near">${near.map((s,i)=>{const on=p.stops.some(x=>x.id===s.id);
    return`<button type="button" data-act="ntog" data-i="${i}" aria-pressed="${on}" style="--c:${MODEC[s.mode]||'var(--bus)'}"><span class="dot"></span><span>${esc(s.name)}<small>${s.walk} min å gå</small></span><b class="mk">${on?'✓':'+'}</b></button>`}).join('')||'<p class="empty" style="padding:10px 14px">Ingen stopp innan 1,5 km.</p>'}</div>
   <div class="btns"><button class="cta" type="button" data-act="ndone">Ferdig</button></div></div>`);
 }catch(e){dialog(`<h2>Fekk ikkje henta stopp</h2><p class="note">${esc(e.message)}</p><div class="btns">${closeBtn}</div>`)}
}

// ---------- kart ----------
let map=null,layer=null,ptMk=null;
function loadLeaflet(){
 return new Promise((ok,no)=>{
  if(window.L)return ok();
  const c=document.createElement('link');c.rel='stylesheet';c.href=LEAFLET+'leaflet.min.css';document.head.appendChild(c);
  const s=document.createElement('script');s.src=LEAFLET+'leaflet.min.js';s.onload=ok;s.onerror=()=>no(new Error('Kartet lasta ikkje'));document.head.appendChild(s);
 });
}
// Opnar kartarket i modus 'add' (legg til stopp) eller 'follow' (følg ein tur). Gir false om Leaflet ikkje lastar.
async function showMap(mode){
 stopFollow();
 const m=$('#map');m.dataset.mode=mode;m.classList.add('on');
 try{await loadLeaflet()}catch(e){$('#mapNote').textContent=e.message;return false}
 if(!map){
  const c=Object.values(pts)[0];
  map=L.map('mapc',{zoomControl:false}).setView(c?[c.lat,c.lon]:[60.39,5.33],c?15:12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  layer=L.layerGroup().addTo(map);
 }
 layer.clearLayers();
 setTimeout(()=>map.invalidateSize(),50);
 return true;
}
async function openMap(pid){
 $('#mapPlace').innerHTML=cfg.places.map(p=>`<option value="${esc(p.id)}"${p.id===pid?' selected':''}>${esc(p.name)}</option>`).join('');
 $('#mapNote').textContent='Flytt kartet, trykk «Vis stopp her», og trykk på eit stopp for å leggje det til.';
 if(!await showMap('add'))return;
 drawPt();
 const c=pts[pid];if(c)map.setView([c.lat,c.lon],16);
}

// ---------- følg ein tur ----------
// Spør Entur om posisjonen til éin tur kvart 10. sekund medan kartet er ope. Heimepunktet blir ikkje vist her.
let follow=null,ft=null,busMk=null,fitted=false;
function stopFollow(){follow=null;clearTimeout(ft);busMk=null}
async function openFollow(r){
 if(!r)return;
 const hex=MODE_HEX[r.mode]||MODE_HEX.bus;
 $('#followHead').innerHTML=`<span class="pill" style="--c:${hex}">${esc(r.line)}</span><b>${esc(r.dest)}</b>`;
 $('#mapNote').textContent='Hentar posisjon …';
 if(!await showMap('follow'))return;
 if(ptMk){ptMk.remove();ptMk=null}
 follow=r;fitted=false;
 const q=r.quay;
 if(q?.latitude!=null){
  L.circleMarker([q.latitude,q.longitude],{radius:9,color:'#0e1116',weight:3,fillColor:'#d7ff3b',fillOpacity:1}).addTo(layer).bindTooltip(r.from.name);
  map.setView([q.latitude,q.longitude],15);
 }
 track();
}
function followText(r,v){
 const m=mins(r.dep),go=m<=0?'Går no':`Går frå ${r.from.name} om ${m} min`;
 if(!v)return`${go}. Ingen posisjon frå denne turen enno. Mange sender først når turen startar, og nokre (til dømes Bybanen) sender ikkje i det heile.`;
 const d=Math.round((v.delay||0)/60),age=Math.max(0,Math.round((Date.now()-new Date(v.lastUpdated))/1000));
 const late=d>=1?`${d} min forseinka`:d<=-1?`${-d} min tidleg`:'i rute';
 return`${go} · ${late} · posisjon for ${age<60?age+' s':Math.round(age/60)+' min'} sidan`;
}
async function track(){
 clearTimeout(ft);
 const r=follow;if(!r)return;
 if(!document.hidden){
  try{
   const j=await post(`{vehicles(serviceJourneyId:${JSON.stringify(r.sj)}){location{latitude longitude} delay lastUpdated}}`,VEH);
   if(r!==follow)return;
   const v=(j.data?.vehicles||[]).find(x=>x.location?.latitude!=null);
   if(v){
    const ll=[v.location.latitude,v.location.longitude];
    if(busMk)busMk.setLatLng(ll);
    else busMk=L.marker(ll,{keyboard:false,icon:L.divIcon({className:'bus-ic',html:$('#followHead .pill').outerHTML,iconSize:[48,30],iconAnchor:[24,15]})}).addTo(layer);
    if(!fitted){fitted=true;const q=r.quay;map.fitBounds(q?.latitude!=null?L.latLngBounds([ll,[q.latitude,q.longitude]]):L.latLngBounds([ll,ll]),{padding:[50,50],maxZoom:16})}
   }else if(busMk){busMk.remove();busMk=null}
   $('#mapNote').textContent=followText(r,v);
  }catch(e){if(r===follow)$('#mapNote').textContent='Fekk ikkje henta posisjon: '+e.message}
 }
 if(r===follow)ft=setTimeout(track,10000);
}
function drawPt(){ // punktet til staden som er vald i kartet
 if(!map)return;if(ptMk){ptMk.remove();ptMk=null}
 const p=place($('#mapPlace').value),c=p&&pts[p.id];
 if(c)ptMk=L.circleMarker([c.lat,c.lon],{radius:9,color:'#0e1116',weight:3,fillColor:'#d7ff3b',fillOpacity:1}).addTo(map).bindTooltip(p.name);
}
async function mapStops(){
 const c=map.getCenter();$('#mapNote').textContent='Hentar stopp …';
 try{
  const r=await post(`{nearest(latitude:${c.lat.toFixed(5)},longitude:${c.lng.toFixed(5)},maximumDistance:1200,maximumResults:60,filterByPlaceTypes:[stopPlace]){edges{node{distance place{...on StopPlace{id name latitude longitude transportMode}}}}}}`);
  const e=r.data?.nearest?.edges||[];layer.clearLayers();
  for(const {node} of e){
   const p=node.place;if(!p?.id)continue;
   const mode=pickMode(p.transportMode); // liste, t.d. ["tram","bus"]
   const m=L.circleMarker([p.latitude,p.longitude],{radius:8,color:'#fff',weight:2,fillColor:MODE_HEX[mode]||'#3a6df0',fillOpacity:1}).addTo(layer);
   const div=document.createElement('div');
   const b=document.createElement('strong');b.textContent=p.name;div.appendChild(b);div.appendChild(document.createElement('br'));
   const btn=document.createElement('button');btn.type='button';btn.textContent='Legg til';
   btn.onclick=()=>{addStop($('#mapPlace').value,{id:p.id,name:p.name,label:'',mode,lat:p.latitude,lon:p.longitude});btn.textContent='Lagt til ✓';btn.disabled=true};
   div.appendChild(btn);m.bindPopup(div);
  }
  $('#mapNote').textContent=e.length?`${e.length} stopp. Trykk på eit for å leggje det til.`:'Ingen stopp her. Flytt kartet og prøv igjen.';
 }catch(x){$('#mapNote').textContent='Fekk ikkje henta stopp: '+x.message}
}

// ---------- deling ----------
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/'))));
function shareLink(){return location.href.split('#')[0]+'#oppsett='+b64e(JSON.stringify({p:cfg.places,t:cfg.trips}))}
function dialog(html){$('#dlg').innerHTML=`<section class="card" style="box-shadow:0 14px 40px rgba(0,0,0,.35)">${html}</section>`}
// Les og vask eit oppsett frå delingslenka (berre `#oppsett=…`-delen).
function readShare(code){
  const o=JSON.parse(b64d(code));
  if(!Array.isArray(o.p)||!Array.isArray(o.t))throw 0;
  return{places:o.p.map(p=>({id:String(p.id),name:String(p.name),stops:(p.stops||[]).map(s=>({id:String(s.id),name:String(s.name),label:String(s.label||''),mode:String(s.mode||'bus'),walk:+s.walk||0}))})),
   trips:o.t.map(t=>t.ferry?{id:String(t.id),ferry:{a:fEnd(t.ferry.a),b:fEnd(t.ferry.b)},dir:t.dir==='ba'?'ba':'ab'}:{id:String(t.id),from:String(t.from),to:String(t.to),lines:String(t.lines||'')})};
}
// Finn koden i ei lima lenke (eller berre koden).
const shareCode=txt=>(String(txt).match(/#oppsett=([A-Za-z0-9_-]+)/)||String(txt).trim().match(/^([A-Za-z0-9_-]{16,})$/)||[])[1];
function offerImport(code){
 try{window._imp=readShare(code)}catch(e){dialog(`<h2>Lenka var øydelagd</h2><p class="note">Sjekk at du fekk med heile lenka.</p><div class="btns">${closeBtn}</div>`);return}
 window._link=location.href.split('#')[0]+'#oppsett='+code;
 // Safari på iPhone (ikkje appen på Heim-skjermen): appen der har eiga lagring og får ikkje med seg importen.
 const ios=navigator.standalone===false?`<p class="note"><b>Brukar du Neste frå Heim-skjermen?</b> Der har appen eiga lagring. Kopier lenka, opne Neste frå Heim-skjermen og vel Oppsett → «Opne delingslenke».</p>`:'';
 dialog(`<h2>Importere oppsett?</h2><p class="note">${window._imp.places.length} stader og ${window._imp.trips.length} reiser. Dette erstattar oppsettet ditt her.</p>${ios}
  <div class="btns"><button class="cta" type="button" data-act="impYes">Importer</button>${ios?'<button class="sec" type="button" data-act="copyLink">Kopier lenka</button>':''}<button class="sec" type="button" data-act="impNo">Avbryt</button></div>`);
}
function checkImport(){
 const m=location.hash.match(/^#oppsett=(.+)$/);if(!m)return;
 offerImport(m[1]);
 history.replaceState(null,'',location.pathname+location.search);
}
function pasteDialog(){
 dialog(`<h2>Opne delingslenke</h2><p class="note">Lim inn lenka du har fått. Brukar du Neste frå Heim-skjermen på iPhone, er det slik du får oppsettet inn i appen.</p>
  <input id="impTxt" type="url" placeholder="Lim inn lenka her" autocomplete="off" aria-label="Delingslenke">
  <div class="btns"><button class="cta" type="button" data-act="impPaste">Opne</button>${navigator.clipboard?.readText?'<button class="sec" type="button" data-act="impClip">Lim inn</button>':''}${closeBtn}</div>`);
}
function tryPaste(txt){const c=shareCode(txt);if(c)offerImport(c);else dialog(`<h2>Fann inga delingslenke</h2><p class="note">Lenka skal innehalde «#oppsett=».</p><div class="btns"><button class="cta" type="button" data-act="paste">Prøv igjen</button>${closeBtn}</div>`)}
// Endra i ei anna fane eller i nettlesaren (Android deler lagring med appen): les inn på nytt.
function syncFromStorage(){
 const c=ls.get('cfg',null);if(!c||JSON.stringify(c)===JSON.stringify(cfg))return;
 cfg=c;pts=ls.get('pts',{});if(view==='setup')renderSetup();else go('trip');
}

// ---------- hendingar ----------
document.addEventListener('click',async e=>{
 const tb=e.target.closest('[data-trip-id]');
 if(tb){cur=tb.dataset.tripId;ls.set('cur',cur);data=null;err=null;at=null;render();load();autoSide();return}
 const rb=e.target.closest('[data-row]');
 if(rb){openFollow(shown[+rb.dataset.row]);return}
 const b=e.target.closest('[data-act]');if(!b||b.matches('input,select'))return;
 const a=b.dataset.act,pid=b.closest('[data-place]')?.dataset.place,tid=b.closest('[data-trip]')?.dataset.trip,p=place(pid),t=cfg.trips.find(x=>x.id===tid);
 const re=()=>{save();renderSetup()};
 switch(a){
  case'openSetup':go('setup');break;
  case'done':go('trip');break;
  case'padd':cfg.places.push({id:uid(),name:'Ny stad',stops:[]});re();break;
  case'pdel':if(cfg.trips.some(x=>x.from===pid||x.to===pid)){dialog(`<h2>Staden er i bruk</h2><p class="note">Slett reisene som brukar «${esc(p.name)}» først.</p><div class="btns"><button class="sec" type="button" data-act="impNo">OK</button></div>`)}else{cfg.places=cfg.places.filter(x=>x.id!==pid);delete pts[pid];savePts();re()}break;
  case'sdel':p.stops.splice(+b.dataset.i,1);re();break;
  case'pick':addStop(pid,b.dataset);re();break;
  case'ferry':ferryDialog();break;
  case'fpick':ferryFrom(b.dataset);break;
  case'froute':ferryMake(fTo[+b.dataset.i]);break;
  case'sit':sitDialog(b.dataset.n);break;
  case'flip':{const f=cfg.trips.find(x=>x.id===cur);if(!f?.ferry)break;f.dir=f.dir==='ba'?'ab':'ba';autoBy='';save();data=null;err=null;render();load()}break;
  case'openMap':openMap(pid);break;
  case'tadd':cfg.trips.push({id:uid(),from:cfg.places[0].id,to:cfg.places[1].id,lines:''});re();break;
  case'tdel':cfg.trips=cfg.trips.filter(x=>x!==t);re();break;
  case'trev':cfg.trips.push({id:uid(),from:t.to,to:t.from,lines:t.lines});re();break;
  case'where':whereDialog(pid);break;
  case'near':nearDialog(pid);break;
  case'wpick':pts[pid]={lat:+b.dataset.lat,lon:+b.dataset.lon,label:b.dataset.name};savePts();nearDialog(pid);break;
  case'wdel':delete pts[pid];savePts();$('#dlg').innerHTML='';renderSetup();break;
  case'wmap':$('#dlg').innerHTML='';openMap(pid);break;
  case'ntog':{const s=near[+b.dataset.i];if(!s||!p)break;const i=p.stops.findIndex(x=>x.id===s.id);
   if(i>=0)p.stops.splice(i,1);else addStop(pid,s);save();const on=i<0;b.setAttribute('aria-pressed',on);b.querySelector('.mk').textContent=on?'✓':'+'}break;
  case'ndone':$('#dlg').innerHTML='';renderSetup();break;
  case'share':if(navigator.share){try{await navigator.share({title:'Neste',text:'Oppsettet mitt i Neste. Opne lenka, eller lim ho inn under Oppsett → «Opne delingslenke».',url:shareLink()})}catch(x){}break}
   try{await navigator.clipboard.writeText(shareLink());b.textContent='Kopiert ✓'}catch(x){dialog(`<h2>Kopier lenka</h2><input readonly value="${esc(shareLink())}" onfocus="this.select()"><div class="btns"><button class="sec" type="button" data-act="impNo">Lukk</button></div>`)}break;
  case'reset':dialog('<h2>Nullstille alt?</h2><p class="note">Alle stader, reiser og punkta for stadene blir sletta frå denne eininga.</p><div class="btns"><button class="cta" type="button" data-act="resetYes">Nullstill</button><button class="sec" type="button" data-act="impNo">Avbryt</button></div>');break;
  case'resetYes':cfg={places:[{id:uid(),name:'Heim',stops:[]}],trips:[]};pts={};savePts();save();$('#dlg').innerHTML='';renderSetup();break;
  case'paste':pasteDialog();$('#impTxt').focus();break;
  case'impPaste':tryPaste($('#impTxt').value);break;
  case'impClip':try{tryPaste(await navigator.clipboard.readText())}catch(x){$('#impTxt').focus()}break;
  case'copyLink':try{await navigator.clipboard.writeText(window._link);b.textContent='Kopiert ✓'}catch(x){dialog(`<h2>Kopier lenka</h2><input readonly value="${esc(window._link)}" onfocus="this.select()"><div class="btns">${closeBtn}</div>`)}break;
  case'impYes':cfg=window._imp;save();$('#dlg').innerHTML='';cur=null;go('trip');break;
  case'impNo':$('#dlg').innerHTML='';break;
  case'mapClose':stopFollow();$('#map').classList.remove('on');if(view==='setup')renderSetup();break;
  case'mapStops':mapStops();break;
  case'mapLocate':try{navigator.geolocation.getCurrentPosition(x=>map.setView([x.coords.latitude,x.coords.longitude],16),()=>{$('#mapNote').textContent='Fekk ikkje posisjonen.'})}catch(x){}break;
  case'mapHome':{const c=map.getCenter(),id=$('#mapPlace').value;pts[id]={lat:+c.lat.toFixed(5),lon:+c.lng.toFixed(5),label:'punktet på kartet'};savePts();$('#map').classList.remove('on');nearDialog(id)}break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target,a=el.dataset.act;if(!a)return;
 const p=place(el.closest('[data-place]')?.dataset.place),t=cfg.trips.find(x=>x.id===el.closest('[data-trip]')?.dataset.trip);
 if(a==='pname'){p.name=el.value.trim()||'Utan namn';save()}
 else if(a==='walk'){p.stops[+el.dataset.i].walk=Math.max(0,Math.min(60,+el.value||0));save()}
 else if(a==='tfrom'){t.from=el.value;save()}
 else if(a==='tto'){t.to=el.value;save()}
 else if(a==='tlines'){t.lines=el.value;save()}
 else if(a==='autoside'){
  ls.set('autoside',el.checked);
  // Spør om lov med ein gong, så ein ikkje blir spurd midt i ei avgangsliste.
  if(el.checked)navigator.geolocation?.getCurrentPosition(()=>{},()=>{el.checked=false;ls.set('autoside',false);
   dialog(`<h2>Fekk ikkje posisjonen</h2><p class="note">Gi nettlesaren lov til å bruke posisjonen, eller vel kai med «Snu».</p><div class="btns">${closeBtn}</div>`)},{timeout:15000});
 }
});
document.addEventListener('input',e=>{if(e.target.dataset.act==='search'){clearTimeout(st);const i=e.target;st=setTimeout(()=>search(i),250)}});
$('#mapPlace').addEventListener('change',drawPt);
$('#setup').addEventListener('click',()=>go(view==='trip'?'setup':'trip'));
$('#status').addEventListener('click',load);
window.addEventListener('storage',e=>{if(e.key==='neste.cfg')syncFromStorage()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();return}syncFromStorage();if(!at||Date.now()-at>20000)load();if(follow)track();if(Date.now()-hiddenAt>120000)autoSide()});
setInterval(()=>{if(!document.hidden)load()},30000);
setInterval(()=>{if(!document.hidden&&view==='trip'&&data)render()},10000);
window.addEventListener('hashchange',checkImport); // delingslenke opna i ei fane som alt viser appen
checkImport();
go(cfg.trips.length?'trip':'setup');
}
</script>
</body>
</html>
